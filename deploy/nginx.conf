# /etc/nginx/sites-available/nurul
# Symlink to /etc/nginx/sites-enabled/nurul then `nginx -t && systemctl reload nginx`.
#
# Canonical: https://nurul.com.bd
# Mirror:    https://nurul.dev  -> 301 -> https://nurul.com.bd

upstream nurul_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP -> HTTPS (all hosts) -----------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nurul.com.bd www.nurul.com.bd nurul.dev www.nurul.dev;

    # Let's Encrypt http-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- www.nurul.com.bd -> nurul.com.bd ----------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.nurul.com.bd;

    ssl_certificate     /etc/letsencrypt/live/nurul.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nurul.com.bd/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nurul.com.bd$request_uri;
}

# --- nurul.dev + www.nurul.dev -> nurul.com.bd -------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nurul.dev www.nurul.dev;

    ssl_certificate     /etc/letsencrypt/live/nurul.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nurul.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nurul.com.bd$request_uri;
}

# --- nurul.com.bd (canonical) ------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nurul.com.bd;

    ssl_certificate     /etc/letsencrypt/live/nurul.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nurul.com.bd/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/rss+xml
        application/atom+xml image/svg+xml font/ttf font/otf;

    # Enable if nginx is built with ngx_brotli (apt: libnginx-mod-brotli on some distros)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 2m;

    # Next.js immutable build assets — hashed filenames, cache forever
    location /_next/static/ {
        proxy_pass http://nurul_next;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Resume PDF — keep it crawlable (200) but don't let Google index it,
    # so the homepage outranks the bare PDF in search results.
    location = /resume.pdf {
        proxy_pass http://nurul_next;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=86400";
    }

    # Static assets in /public — long cache, must-revalidate is fine
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|avif|webp|png|jpe?g|gif|ico|svg|mp4|webm)$ {
        proxy_pass http://nurul_next;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://nurul_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
